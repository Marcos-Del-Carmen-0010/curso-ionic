<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title size="large">Iniciar sesión</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <form [formGroup]="formLogin" (ngSubmit)="submit()">
    <ion-list>
      <ion-item>
        <ion-input type="email" fill="solid" label="Email" labelPlacement="floating" formControlName="email"></ion-input>
      </ion-item>

      <ion-item>
        <ion-input type="password" label="Contraseña" fill="solid" labelPlacement="floating" formControlName="password">
          <ion-input-password-toggle slot="end"></ion-input-password-toggle>
        </ion-input>
      </ion-item>
      <ion-item>
        <ion-button type="submit" class="content-center">Ingresar</ion-button>
      </ion-item>
      <ion-item>
        ¿No tienes cuenta? &nbsp;<a [routerLink]="['/register']"> Crear una cuenta</a>
      </ion-item>
    </ion-list>
  </form>
</ion-content>
