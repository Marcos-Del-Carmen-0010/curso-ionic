<ion-row>
  <ion-col size="12">
    <ion-card color="tertiary">
      <ion-card-header>
        <ion-card-title>{{article.title}}</ion-card-title>
        <ion-card-subtitle>{{article.userId}}</ion-card-subtitle>
      </ion-card-header>
      <ion-card-content>
        {{article.body}}
      </ion-card-content>
      <ion-button (click)="goToArticle()">Go to</ion-button>
    </ion-card>
  </ion-col>
</ion-row>
