<ion-card style="padding: .5rem;">
  <ion-input label="Search product" (keydown)="validateInput($event)" placeholder="Name product"></ion-input>
</ion-card>
<app-detail-carrito></app-detail-carrito>
@if(!cargando) {
  @for (item of articles; track $index) {
    <app-product-detail [product]="item"> </app-product-detail>
  } @empty {
    <p class="text-center">No hay articulos</p>
  }
} @else {
  <p class="text-center">Cargando...</p>
}
