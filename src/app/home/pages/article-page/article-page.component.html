<ion-content>
  <app-header [title]="title"></app-header>
  <div style="height: 100%">
    <ion-grid>
      @if (article) {
        <ion-row>
          <ion-col size="12">
            <ion-card color="tertiary">
              <ion-card-header>
                <ion-card-title>{{article.title}}</ion-card-title>
                <ion-card-subtitle>{{article.userId}}</ion-card-subtitle>
              </ion-card-header>
              <ion-card-content>
                {{article.body}}
              </ion-card-content>
            </ion-card>
          </ion-col>
        </ion-row>
      }
    </ion-grid>
  </div>
  <app-footer></app-footer>
</ion-content>
